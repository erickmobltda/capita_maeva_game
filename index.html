<title>Capitã Maeva</title>
<style>
html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:rgba(0,0,0,0);touch-action:none}
#game{position:absolute;left:50%;top:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;background:#5c94fc}
#pad{position:fixed;left:2.5vmin;bottom:2.5vmin;display:none;z-index:5}
.btn{float:left;width:18vmin;height:18vmin;margin-right:3vmin;-webkit-transition:-webkit-transform .05s;transition:transform .05s}
.btn canvas{width:100%;height:100%;display:block;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none}
#mute{position:fixed;top:1.8vmin;left:50%;margin-left:-3.6vmin;width:7.2vmin;height:6vmin;z-index:6;cursor:pointer;
  background:rgba(10,16,48,.55);border:.4vmin solid #fff;border-radius:1vmin;box-sizing:border-box;padding:.6vmin}
#mute canvas{width:100%;height:100%;display:block;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none}
.btn.down{-webkit-transform:scale(.9);transform:scale(.9);-webkit-filter:brightness(.8);filter:brightness(.8)}
</style>

}

function drawHUD() {
  var i;
  for (i = 0; i < MAX_LIVES; i++) ctx.drawImage(i < lives ? heartF : heartE, 0, 0, 7, 6, 8 + i * 17, 8, 14, 12);
  // heart upscale 2x
  var s = 'PONTOS ' + score();
  drawText(s, W - 8 - textW(s, 2), 8, 2, '#ffffff', '#1a2250');
}

function panel(x, y, w, h) {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = '#1a2250'; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
}


/* ================= TITLE SCREEN ================= */
var TITLE_CX = 352, BIG_X = 120;
function titleWord(str, cx, y, sc, col, delayBase) {
  var w = textW(str, sc), x0 = Math.round(cx - w / 2), i, li, off, dy, x, ch;
  for (i = 0; i < str.length; i++) {
    li = Math.max(0, Math.min(1, (stateT - (delayBase + i) * 0.07) / 0.45));
    off = -Math.round((1 - li) * (1 - li) * 160);
    dy = li >= 1 ? Math.round(Math.sin(clock * 4 + (delayBase + i) * 0.7) * 3) : 0;
    x = x0 + i * 6 * sc; ch = str.charAt(i);
    drawText(ch, x + Math.round(sc * 0.6), y + off + dy, sc, '#1a2250', '#1a2250');
    drawText(ch, x, y + off + dy, sc, col, null);
  }
}
function star(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.fillRect(x - r, y, 2 * r + 1, 1); ctx.fillRect(x, y - r, 1, 2 * r + 1);
  if (r > 1) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, 1, 1); }
}
function drawTitleMaeva() {
  var t = clock % 3.2, name, yoff = 0, u, k, f, sw, i;
  if (t < 2.0) name = 'w' + ((Math.floor(walkClock / 2) % 12) * 2);
  else {
    u = t - 2.0;
    if (u < 0.10) name = 'j2';
    else if (u < 0.18) name = 'j3';
    else if (u < 0.86) {
      k = (u - 0.18) / 0.68; yoff = Math.round(46 * 4 * k * (1 - k));
      name = (k < 0.08) ? 'j4' : (k < 0.33) ? 'j5' : (k < 0.63) ? 'j6' : 'j7';
    } else if (u < 0.94) name = 'j8';
    else if (u < 1.02) name = 'j9';
    else name = 'j10';
  }
  f = bframes[name]; if (!f) return;
  sw = Math.max(20, 56 - Math.floor(yoff / 2));
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(Math.round(BIG_X - sw / 2), GY + 1, sw, 3);
  ctx.drawImage(atlasBig, f[0], 0, f[1], f[2], Math.round(BIG_X - f[1] / 2), GY + 1 - yoff - f[2], f[1], f[2]);
  var sp = [[-44, -92, 2], [46, -84, 1], [-58, -40, 1], [60, -34, 2], [-6, -140, 1], [30, -128, 1]];
  for (i = 0; i < sp.length; i++) {
    if (Math.sin(clock * 4 + i * 1.9) > 0.15) star(BIG_X + sp[i][0], GY + sp[i][1], sp[i][2], '#fff6a8');
  }
}
function drawTitle() {
  drawTitleMaeva();
  titleWord('CAPITÃ', TITLE_CX, 46, 6, '#ffe14a', 0);
  titleWord('MAEVA', TITLE_CX, 100, 7, '#ffffff', 6);
  if (stateT > 1.0) {
    if (Math.floor(clock * 2) % 2 === 0) { var m = 'APERTE PARA JOGAR'; drawText(m, Math.round(TITLE_CX - textW(m, 2) / 2), 166, 2, '#ffe14a', '#1a2250'); }
    var h = 'BOTÃO 1 PULA   BOTÃO 2 ABAIXA';
    drawText(h, Math.round(TITLE_CX - textW(h, 1) / 2), 192, 1, '#ffffff', '#1a2250');
  }
}

function render() {
  var sx = 0, sy = 0, j, o;
  if (shake > 0) { sx = (Math.floor(clock * 60) % 2) ? 1 : -1; sy = 0; }
  ctx.save();
  ctx.translate(sx, sy);
  ctx.drawImage(sky, 0, 0);
  drawLayer(clouds, 8, 0.08);
  drawLayer(hills, GY - 92, 0.22);
  // ground
  var off = Math.floor(dist % 32), x;
  for (x = -off; x < W; x += 32) ctx.drawImage(gtile, x, GY - 2);
  // obstacles
  for (j = 0; j < obstacles.length; j++) {
    o = obstacles[j];
    if (o.t === 'bee') {
      var bob = Math.round(Math.sin(clock * 6 + o.idx) * 2);
      ctx.drawImage(Math.floor(clock * 12) % 2 ? ART.bee1 : ART.bee0, Math.round(o.x), GY + 2 - o.yb - o.h + bob);
    } else ctx.drawImage(o.spr, Math.round(o.x), GY + 2 - o.h);
  }
  if (state !== 'title') drawPlayer();
  // hints for the first obstacles
  if (state === 'play' && p.s !== 'air' && p.s !== 'prep') {
    for (j = 0; j < obstacles.length; j++) {
      o = obstacles[j];
      if (o.idx < 4 && !o.hit && o.x - PX > 30 && o.x - PX < 170) {
        var hb = Math.round(Math.sin(clock * 10) * 2), msg = (o.t === 'bee') ? 'ABAIXE!' : 'PULE!';
        drawText(msg, Math.round(PX - textW(msg, 2) / 2), GY - 100 + hb, 2, '#ffe14a', '#1a2250');
        break;
      }
    }
  }
  ctx.restore();

  if (state === 'title') {
    drawTitle();
  } else {
    drawHUD();
    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
      panel(110, 58, 260, 136);
      drawTextC('GAME OVER', 72, 4, '#ff5a4a', '#000000');
      drawTextC('PONTOS ' + score(), 116, 2, '#ffffff', '#000000');
      drawTextC('RECORDE ' + best, 136, 2, '#ffe14a', '#000000');
      if (stateT > 0.8 && Math.floor(clock * 2.5) % 2 === 0) drawTextC('TENTAR DE NOVO', 166, 2, '#7be88a', '#000000');
    }
  }
}

/* ================= LOOP ================= */
var lastT = 0;
function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(function () { f(now()); }, 16); };
function loop(t) {
  if (!lastT) lastT = t;
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render();
  raf(loop);
}

function boot() {
  sky = makeSky(); clouds = makeCloudLayer(); hills = makeHillLayer(); gtile = makeGroundTile();
  heartF = makeHeart(true); heartE = makeHeart(false);
  ART.bee0 = makeBee(false); ART.bee1 = makeBee(true); ART.bush = makeBush(); ART.rock = makeRock(); ART.crate = makeCrate(); ART.pipe = makePipe();
  var c1 = b1.getElementsByTagName('canvas')[0].getContext('2d');
  var c2 = b2.getElementsByTagName('canvas')[0].getContext('2d');
  c1.drawImage(makeButton1(), 0, 0); c2.drawImage(makeButton2(), 0, 0);
  resetGame();
  raf(loop);
}
function oneLoaded() { loaded++; if (loaded === 2) boot(); }
atlas.onload = oneLoaded; atlasBig.onload = oneLoaded;
atlas.src = 'data:image/png;base64,' + ATLAS_B64;
atlasBig.src = 'data:image/png;base64,' + ATLAS_BIG_B64;

})();
</script>
