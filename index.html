function glyph(ch) { var g = FONT[ch]; return g ? g.split('/') : null; }
function textW(s, sc) { return s.length * 6 * sc - sc; }
function drawText(s, x, y, sc, col, shadow) {
  var i, r, c, rows, cx = x;
  for (i = 0; i < s.length; i++) {
    var chr = s.charAt(i), tilde = false;
    if (chr === '\u00c3') { chr = 'A'; tilde = true; }
    rows = glyph(chr);
    if (rows) {
      if (tilde) {
        var tl = ['.##.#', '#.##.'], tr_, tc_;
        for (tr_ = 0; tr_ < 2; tr_++) for (tc_ = 0; tc_ < 5; tc_++) if (tl[tr_].charAt(tc_) === '#') {
          if (shadow) { ctx.fillStyle = shadow; ctx.fillRect(cx + tc_ * sc, y + (tr_ - 3) * sc + sc, sc, sc); }
          ctx.fillStyle = col; ctx.fillRect(cx + tc_ * sc, y + (tr_ - 3) * sc, sc, sc);
        }
      }
      if (shadow) {
        ctx.fillStyle = shadow;
        for (r = 0; r < 7; r++) for (c = 0; c < 5; c++)
          if (rows[r].charAt(c) === '#') ctx.fillRect(cx + c * sc, y + r * sc + sc, sc, sc);
      }
      ctx.fillStyle = col;
      for (r = 0; r < 7; r++) for (c = 0; c < 5; c++)
        if (rows[r].charAt(c) === '#') ctx.fillRect(cx + c * sc, y + r * sc, sc, sc);
    }
    cx += 6 * sc;
  }
}

/* ================= PROCEDURAL PIXEL ART ================= */
function paint(w, h, colorAt) {
  var c = mk(w, h), g = c.getContext('2d'), x, y, col;
  for (y = 0; y < h; y++) for (x = 0; x < w; x++) { col = colorAt(x, y); if (col) pix(g, x, y, col); }
  return c;
}
function edgeOf(inside, x, y) {
  return !inside(x - 1, y) || !inside(x + 1, y) || !inside(x, y - 1) || !inside(x, y + 1);
}

function makeBush() {
  var w = 30, h = 18, cs = [[8, 11, 7], [15, 8, 8], [23, 11, 7]];
  function inside(x, y) {
    if (x < 0 || y < 0 || x >= w || y >= h) return false;
    if (y >= 12 && x >= 2 && x <= 27) return true;
    for (var i = 0; i < cs.length; i++) {
      var dx = x + 0.5 - cs[i][0], dy = y + 0.5 - cs[i][1];
      if (dx * dx + dy * dy <= cs[i][2] * cs[i][2]) return true;
    }
    return false;
  }
  return paint(w, h, function (x, y) {
    if (!inside(x, y)) return null;
    if (edgeOf(inside, x, y)) return '#14501f';
    for (var i = 0; i < cs.length; i++) {
      var dx = x + 0.5 - (cs[i][0] - 2), dy = y + 0.5 - (cs[i][1] - 2), r = cs[i][2] * 0.5;
      if (dx * dx + dy * dy <= r * r) return '#7be88a';
    }
    return y >= 14 ? '#1f7d2e' : '#33b04a';
  });
}
function makeRock() {
  var w = 22, h = 14;
  function inside(x, y) {
    if (x < 0 || y < 0 || x >= w || y >= h) return false;
    var a = (x + 0.5 - 11) / 10.8, b = (y + 0.5 - 13.5) / 13;
    return a * a + b * b <= 1;
  }
  return paint(w, h, function (x, y) {
    if (!inside(x, y)) return null;
    if (edgeOf(inside, x, y)) return '#3b3b4d';
    if ((x === 12 && y > 4 && y < 9) || (x === 13 && y >= 8 && y < 11)) return '#5d5d70';
    if (x + y < 15 && y < 8) return '#c9c9d9';
    if (x + y > 24) return '#7a7a8e';
    return '#9d9db0';
  });
}
function makeCrate() {
  var w = 22, h = 22;
  return paint(w, h, function (x, y) {
    if (x === 0 || y === 0 || x === w - 1 || y === h - 1) return '#4e270b';
    if (x === 1 || y === 1 || x === w - 2 || y === h - 2) return '#8a5a22';
    if ((x === 2 || y === 2) ) return '#efb868';
    if (x === y || x === w - 1 - y) return '#7a4a18';
    if (y === 7 || y === 14) return '#a8692a';
    return '#cf8a3a';
  });
}
function makePipe() {
  var w = 26, h = 28;
  return paint(w, h, function (x, y) {
    var rim = y < 8, x0 = rim ? 0 : 2, x1 = rim ? w - 1 : w - 3;
    if (x < x0 || x > x1) return null;
    if (x === x0 || x === x1 || y === 0 || (y === 7 && rim) || y === h - 1) return '#0f4a1c';
    if (x === x0 + 1 || x === x0 + 2) return '#86f09a';
    if (x === x0 + 3) return '#47d062';
    if (x >= x1 - 4) return '#1a7a2e';
    return '#2fb54a';
  });
}
function makeHeart(full) {
  var rows = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
  return paint(7, 6, function (x, y) {
    if (rows[y].charAt(x) !== '#') return null;
    if (full) return (x === 1 && y === 1) ? '#ffd0cc' : '#e8302a';
    return '#4a4f6e';
  });
}
function makeCloudLayer() {
  var c = mk(W, 110), g = c.getContext('2d');
  function cloud(cx, cy, k) {
    var cs = [[0, 0, 9 * k], [-11 * k, 3 * k, 6 * k], [11 * k, 3 * k, 7 * k], [-20 * k, 7 * k, 4 * k], [20 * k, 7 * k, 4 * k]];
    var x, y, i, inside = function (px, py) {
      for (i = 0; i < cs.length; i++) {
        var dx = px + 0.5 - (cx + cs[i][0]), dy = py + 0.5 - (cy + cs[i][1]);
        if (dx * dx + dy * dy <= cs[i][2] * cs[i][2] && py <= cy + 9 * k) return true;
      }
      return false;
    };
    for (y = cy - 12 * k; y <= cy + 10 * k; y++) for (x = cx - 26 * k; x <= cx + 26 * k; x++) {
      if (inside(x, y)) pix(g, x, y, (y >= cy + 5 * k) ? '#c4dcff' : '#ffffff');
    }
  }
  cloud(70, 30, 1.3); cloud(230, 62, 1); cloud(360, 24, 1.5); cloud(445, 70, 0.9);
  return c;
}
function makeHillLayer() {
  var h = 92, c = mk(W, h), g = c.getContext('2d');
  var hills = [[90, 70, 44], [270, 92, 66], [415, 60, 34]];
  var x, y, i, top, t, v;
  for (x = 0; x < W; x++) {
    top = h;
    for (i = 0; i < hills.length; i++) {
      t = (x - hills[i][0]) / hills[i][1];
      if (t > -1 && t < 1) { v = h - hills[i][2] * Math.sqrt(1 - t * t); if (v < top) top = v; }
    }
    top = Math.round(top);
    for (y = top; y < h; y++) {
      var col = '#4cb34c';
      if (y === top) col = '#2b7a2b';
      else if (((x + y * 2) % 23 === 0) || ((x + y * 2) % 23 === 1 && y > top + 3)) col = '#78d478';
      else if (y > h - 10) col = '#3e9a3e';
      pix(g, x, y, col);
    }
  }
  return c;
}
function makeSky() {
  var c = mk(W, H), g = c.getContext('2d');
  var bands = ['#3f7cf0', '#4a87f4', '#5c94fc', '#6fa3ff', '#85b4ff', '#9cc5ff', '#b4d6ff'];
  var i, bh = Math.ceil(GY / bands.length);

  // sun
  var x, y, dx, dy, d;

    dx = x + 0.5 - 400; dy = y + 0.5 - 42; d = dx * dx + dy * dy;
    if (d <= 16 * 16) pix(g, x, y, d > 14 * 14 ? '#ffb02e' : (d < 7 * 7 && dx < 0 && dy < 0 ? '#fff6a8' : '#ffe14a'));
  }

}
function makeGroundTile() {
  var w = 32, h = H - GY + 2;
  return paint(w, h, function (x, y) {
    if (y < 2) {
      if (y === 1 && ((x >= 5 && x <= 7) || (x >= 21 && x <= 24))) return '#3eb23f';
      if (y === 0 && (x === 6 || x === 22 || x === 23)) return '#3eb23f';

    }
    if (y < 4) return '#8be04e';
    if (y < 8) return '#3eb23f';
    if (y === 8) return '#1f7a2e';
    var yy = y - 9, r = Math.floor(yy / 8);
    if (yy % 8 === 7) return '#7a3f12';
    if (((x + (r % 2 ? 8 : 0)) % 16) === 15) return '#7a3f12';
    if (yy % 8 === 0) return '#e8a050';
    return '#c97b2f';
  });
}
function makeButton1() {

var i0;
for (i0 = 0; i0 < ATLAS_META.length; i0++) frames[ATLAS_META[i0][0]] = [ATLAS_META[i0][1], ATLAS_META[i0][2], ATLAS_META[i0][3]];

/* ================= STATE ================= */
var state = 'title';             // title | play | over
var stateT = 0;
var dist = 0, speed = 70, playT = 0;
var lives = MAX_LIVES;
var best = 0;
try { best = parseInt(window.localStorage.getItem('capitamaeva_best') || '0', 10) || 0; } catch (e) { best = 0; }
var jumpBuf = 0, walkClock = 0, shake = 0, clock = 0;
var obstacles = [], nextGap = 0, spawnCount = 0;
var p = { s: 'run', t: 0, y: 0, vy: 0, inv: 0 };

function resetGame() {
  dist = 0; playT = 0; speed = 150; lives = MAX_LIVES; obstacles = []; spawnCount = 0;
  nextGap = 300; jumpBuf = 0; shake = 0;
  p.s = 'run'; p.t = 0; p.y = 0; p.vy = 0; p.inv = 0;
}
function score() { return Math.floor(dist / 10); }

function goState(s) { state = s; stateT = 0; }

/* ================= INPUT ================= */
function pressJump() {
  if (state === 'title') { if (stateT > 0.25) { resetGame(); goState('play'); } }
  else if (state === 'over') { if (stateT > 0.8) { resetGame(); goState('play'); } }
  else jumpBuf = 0.12;
}
function pressAction2() { /* placeholder: action for button 2 will be added later */ }

window.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k === 32 || k === 13 || k === 38 || k === 90) {
    e.preventDefault();
    if (!e.repeat) pressJump();
  } else if (k === 40 || k === 88) { e.preventDefault(); if (!e.repeat) pressAction2(); }
}, false);

function bindPress(el, down, up) {
  function d(e) { e.preventDefault(); if (down) down(); if (el.classList) el.classList.add('down'); }
  function u(e) { e.preventDefault(); if (up) up(); if (el.classList) el.classList.remove('down'); }
  el.addEventListener('touchstart', d, false);
  el.addEventListener('touchend', u, false);
  el.addEventListener('touchcancel', u, false);
  el.addEventListener('mousedown', d, false);
  el.addEventListener('mouseup', u, false);
  el.addEventListener('mouseleave', function () { if (el.classList) el.classList.remove('down'); }, false);
}

/* ================= GAME LOGIC ================= */
function spawnObstacle() {
  var types = ['bush', 'rock', 'crate', 'pipe'];
  var t = types[Math.floor(Math.random() * types.length)];
  var spr = ART[t];
  var o = { t: t, spr: spr, x: W + 20, w: spr.width, h: spr.height, hit: false, idx: spawnCount++ };
  obstacles.push(o);
  nextGap = rnd(1.3, 2.2) * speed;
}

function updatePlayer(dt) {
  p.t += dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.s === 'run') {
    if (jumpBuf > 0 && state === 'play') { p.s = 'prep'; p.t = 0; jumpBuf = 0; }
  } else if (p.s === 'prep') {
    if (p.t >= PREP) { p.s = 'air'; p.t = 0; p.vy = V0; }
  } else if (p.s === 'air') {
    p.vy -= GRAV * dt; p.y += p.vy * dt;
    if (p.y <= 0 && p.vy < 0) { p.y = 0; p.vy = 0; p.s = 'land'; p.t = 0; }
  } else if (p.s === 'land') {
    if (jumpBuf > 0 && state === 'play') { p.s = 'prep'; p.t = 0; jumpBuf = 0; }
    else if (p.t >= LAND) { p.s = 'run'; p.t = 0; }
  }
}

function checkCollisions() {
  var j, o, left = PX - 9, right = PX + 9;
  if (p.inv > 0) return;
  for (j = 0; j < obstacles.length; j++) {
    o = obstacles[j];
    if (o.hit) continue;
    if (right > o.x + 4 && left < o.x + o.w - 4 && p.y < o.h - 4) {
      o.hit = true;
      lives--;
      p.inv = INV_TIME;
      shake = 0.25;
      if (lives <= 0) {
        lives = 0;
        if (score() > best) { best = score(); try { window.localStorage.setItem('capitamaeva_best', String(best)); } catch (e) {} }
        goState('over');
      }
      return;
    }
  }
}

function update(dt) {
  clock += dt; stateT += dt;
  if (jumpBuf > 0) jumpBuf -= dt;
  if (shake > 0) shake -= dt;

  if (state === 'over') return;

  if (state === 'title') { speed = 110; } else { playT += dt; speed = 150 + Math.min(80, playT * 1.6); }
  dist += speed * dt;
  walkClock += dt * speed * 0.28;

  if (state === 'play') {
    updatePlayer(dt);
    var k;
    for (k = 0; k < obstacles.length; k++) obstacles[k].x -= speed * dt;
    while (obstacles.length && obstacles[0].x + obstacles[0].w < -20) obstacles.shift();
    var last = obstacles.length ? obstacles[obstacles.length - 1] : null;
    if (!last) { if (spawnCount === 0 ? playT > 0.8 : true) spawnObstacle(); }
    else if (last.x + last.w + nextGap < W + 20) spawnObstacle();
    checkCollisions();
  }
}

/* ================= RENDER ================= */
var sky, clouds, hills, gtile, heartF, heartE;

function frameFor() {
  if (state === 'over') return 'j0';
  if (state === 'title' || p.s === 'run') return 'w' + (Math.floor(walkClock) % 24);
  if (p.s === 'prep') return 'j' + (1 + Math.min(2, Math.floor(p.t / (PREP / 3))));
  if (p.s === 'air') {
    if (p.t < 0.07 && p.vy > V0 * 0.8) return 'j4';
    if (p.vy > V0 * 0.35) return 'j5';
    if (p.vy > -V0 * 0.25) return 'j6';
    return 'j7';
  }
  return 'j' + (8 + Math.min(4, Math.floor(p.t / (LAND / 5))));
}

function drawLayer(img, y, factor) {
  var off = Math.floor((dist * factor) % W);
  ctx.drawImage(img, -off, y);
  ctx.drawImage(img, W - off, y);
}

function drawPlayer() {
  var f = frames[frameFor()];
  if (!f) return;
  if (p.inv > 0 && state === 'play' && Math.floor(p.inv * 12) % 2 === 0) return;
  var dx = Math.round(PX - f[1] / 2), dy = Math.round(GY + 1 - p.y - f[2]);
  // shadow
  var sw = Math.max(8, 22 - Math.floor(p.y / 5));
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(Math.round(PX - sw / 2), GY + 1, sw, 2);
  ctx.drawImage(atlas, f[0], 0, f[1], f[2], dx, dy, f[1], f[2]);
}

function drawHUD() {
  var i;
  for (i = 0; i < MAX_LIVES; i++) ctx.drawImage(i < lives ? heartF : heartE, 0, 0, 7, 6, 8 + i * 17, 8, 14, 12);
  // heart upscale 2x
  var s = 'PONTOS ' + score();
  drawText(s, W - 8 - textW(s, 2), 8, 2, '#ffffff', '#1a2250');
}

function panel(x, y, w, h) {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = '#1a2250'; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
}

function render() {
  var sx = 0, sy = 0, j, o;
  if (shake > 0) { sx = (Math.floor(clock * 60) % 2) ? 1 : -1; sy = 0; }
  ctx.save();
  ctx.translate(sx, sy);
  ctx.drawImage(sky, 0, 0);
  drawLayer(clouds, 8, 0.08);
  drawLayer(hills, GY - 92, 0.22);
  // ground
  var off = Math.floor(dist % 32), x;
  for (x = -off; x < W; x += 32) ctx.drawImage(gtile, x, GY - 2);
  // obstacles
  for (j = 0; j < obstacles.length; j++) {
    o = obstacles[j];
    ctx.drawImage(o.spr, Math.round(o.x), GY + 2 - o.h);
  }
  drawPlayer();
  // jump hint for first obstacles
  if (state === 'play' && p.s === 'run') {
    for (j = 0; j < obstacles.length; j++) {
      o = obstacles[j];
      if (o.idx < 3 && !o.hit && o.x - PX > 30 && o.x - PX < 150) {
        var bob = Math.round(Math.sin(clock * 10) * 2);
        drawText('PULE!', PX - 14, GY - 100 + bob, 2, '#ffe14a', '#1a2250');
        break;
      }
    }
  }
  ctx.restore();

  if (state === 'title') {
    drawTextC('CAPIT\u00c3 MAEVA', 54, 5, '#ffffff', '#1a2250');
    if (Math.floor(clock * 2) % 2 === 0) drawTextC('APERTE PARA JOGAR', 112, 2, '#ffe14a', '#1a2250');
  } else {
    drawHUD();
    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
      panel(110, 58, 260, 136);
      drawTextC('GAME OVER', 72, 4, '#ff5a4a', '#000000');
      drawTextC('PONTOS ' + score(), 116, 2, '#ffffff', '#000000');
      drawTextC('RECORDE ' + best, 136, 2, '#ffe14a', '#000000');
      if (stateT > 0.8 && Math.floor(clock * 2.5) % 2 === 0) drawTextC('TENTAR DE NOVO', 166, 2, '#7be88a', '#000000');
    }
  }
}

/* ================= LOOP ================= */
var lastT = 0;
function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame || function (f) { return setTimeout(function () { f(now()); }, 16); };
function loop(t) {
  if (!lastT) lastT = t;
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render();
  raf(loop);
}
